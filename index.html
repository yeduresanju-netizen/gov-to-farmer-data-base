<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - Government to Farmer Data</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --soil: #4a3a28;
      --forest: #234832;
      --forest-deep: #16301f;
      --wheat: #c99a2e;
      --wheat-light: #e6c877;
      --sage: #93a988;
      --paper: #f6f2e7;
      --paper-card: #fffdf8;
      --line: #e2dac4;
      --danger: #a8402f;
      --danger-deep: #7f2f22;
      --ink: #2b2a22;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Work Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at 15% 0%, rgba(147, 169, 136, 0.16), transparent 45%),
        repeating-linear-gradient(180deg, rgba(74, 58, 40, 0.035) 0px, rgba(74, 58, 40, 0.035) 1px, transparent 1px, transparent 34px),
        var(--paper);
      color: var(--ink);
      margin: 0;
      padding: 32px 20px 60px;
      min-height: 100vh;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      background: var(--paper-card);
      padding: 0 0 32px;
      border-radius: 18px;
      box-shadow: 0 1px 2px rgba(35, 72, 50, 0.06), 0 18px 40px -22px rgba(22, 48, 31, 0.35);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    /* -- Header: a small plowed field motif behind the title -- */
    .portal-header {
      position: relative;
      background: linear-gradient(160deg, var(--forest) 0%, var(--forest-deep) 100%);
      padding: 30px 32px 24px;
      color: #f4ead0;
      overflow: hidden;
    }

    .portal-header::before {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 44%;
      background: repeating-linear-gradient(
        100deg,
        rgba(201, 154, 46, 0.16) 0px,
        rgba(201, 154, 46, 0.16) 2px,
        transparent 2px,
        transparent 26px
      );
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--wheat-light);
      font-weight: 600;
      margin-bottom: 10px;
    }

    .eyebrow svg { width: 16px; height: 16px; }

    h2.portal-title {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 30px;
      margin: 0;
      color: #fbf6e6;
      position: relative;
      z-index: 1;
    }

    .portal-subtitle {
      margin: 6px 0 0;
      font-size: 13.5px;
      color: rgba(244, 234, 208, 0.75);
      position: relative;
      z-index: 1;
    }

    .portal-body { padding: 26px 32px 0; }

    .field { margin-bottom: 18px; }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
      font-size: 13.5px;
      color: var(--soil);
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 14px;
      background: #fffefb;
      color: var(--ink);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: var(--forest);
      box-shadow: 0 0 0 3px rgba(35, 72, 50, 0.12);
    }

    input[type="text"]::placeholder, input[type="password"]::placeholder {
      color: #a79b7d;
    }

    .item-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }

    .item-row input { flex: 1; }

    button {
      background: var(--forest);
      color: #fbf6e6;
      border: none;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      font-family: inherit;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    button:hover { background: var(--forest-deep); }
    button:active { transform: translateY(1px); }

    button.btn-danger { background: var(--danger); padding: 9px 14px; }
    button.btn-danger:hover { background: var(--danger-deep); }

    button.btn-fetch {
      background: var(--wheat);
      color: var(--forest-deep);
    }
    button.btn-fetch:hover { background: #b9891f; }

    button.btn-save {
      font-size: 16px;
      width: 100%;
      padding: 15px;
      margin-top: 6px;
      background: var(--forest);
      box-shadow: 0 10px 22px -12px rgba(35, 72, 50, 0.55);
    }
    button.btn-save:hover { background: var(--forest-deep); }

    hr {
      border: none;
      border-top: 1px dashed var(--line);
      margin: 24px 0;
    }

    .card {
      border: 1px solid var(--line);
      padding: 18px 18px 16px;
      border-radius: 12px;
      margin-bottom: 22px;
      background: #fbf8f0;
      position: relative;
    }

    .card h3 {
      margin: 0 0 14px;
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 18px;
      color: var(--forest-deep);
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .card h3 .badge-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--sage);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    .card h3 .badge-icon svg { width: 15px; height: 15px; color: #16301f; }

    #msp-list .item-row, #schemes-list .item-row {
      background: #fffefb;
      border: 1px solid var(--line);
      padding: 8px 10px;
      border-radius: 8px;
    }

    #status {
      font-weight: 600;
      margin-top: 16px;
      font-size: 13.5px;
      min-height: 18px;
    }

    /* small wheat-sprig divider used as a section signature */
    .sprig-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--sage);
      margin: 4px 0 20px;
      user-select: none;
    }
    .sprig-divider::before, .sprig-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    .sprig-divider svg { width: 18px; height: 18px; }

    @media (max-width: 560px) {
      .portal-header, .portal-body { padding-left: 20px; padding-right: 20px; }
      .item-row { flex-wrap: wrap; }
      .item-row input { min-width: 140px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="portal-header">
      <div class="eyebrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21c0-6 4-9 8-10-1 6-4 9-8 10Z"/><path d="M12 21c0-6-4-9-8-10 1 6 4 9 8 10Z"/><path d="M12 21V9"/></svg>
        शासन ते शेतकरी
      </div>
      <h2 class="portal-title">Farmer App Admin Panel</h2>
      <p class="portal-subtitle">MSP दर आणि योजना अपडेट करा — थेट गाव पर्यंत पोहोचणारी माहिती.</p>
    </div>

    <div class="portal-body">

      <div class="field">
        <label for="token">GitHub Personal Access Token (PAT):</label>
        <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
      </div>

      <button class="btn-fetch" onclick="loadData()">Fetch Latest Data</button>
      <hr>

      <div class="card">
        <h3>
          <span class="badge-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M12 2c-4 2-6 5-6 9s2 6 6 6 6-2 6-6-2-7-6-9Z"/></svg>
          </span>
          MSP Items (हमीभाव)
        </h3>
        <div id="msp-list"></div>
        <button onclick="addMspRow()">+ Add Item</button>
      </div>

      <div class="sprig-divider">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20V4M12 4 8 8M12 4l4 4M12 10 8 13M12 10l4 3M12 15l-3 3M12 15l3 3"/></svg>
      </div>

      <div class="card">
        <h3>
          <span class="badge-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V9l8-5 8 5v12"/><path d="M9 21v-6h6v6"/></svg>
          </span>
          Live Schemes (योजना)
        </h3>
        <div id="schemes-list"></div>
        <button onclick="addSchemeRow()">+ Add Scheme</button>
      </div>

      <button class="btn-save" onclick="saveData()">Save &amp; Update App Data</button>
      <div id="status"></div>

    </div>
  </div>

  <script>
    const repoOwner = "yeduresanju-netizen";
    const repoName = "gov-to-farmer-data-base";
    const filePath = "data.json";
    let fileSha = "";

    async function loadData() {
      const token = document.getElementById("token").value;
      const status = document.getElementById("status");
      status.style.color = "blue";
      status.innerText = "Fetching data...";

      try {
        const res = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${filePath}`, {
          headers: token ? { Authorization: `token ${token}` } : {}
        });

        if (!res.ok) throw new Error("Failed to fetch data");

        const data = await res.json();
        fileSha = data.sha;

        // --- FIXED MARATHI UTF-8 DECODING HERE ---
        const binaryString = atob(data.content.replace(/\s/g, ''));
        const bytes = Uint8Array.from(binaryString, char => char.charCodeAt(0));
        const jsonText = new TextDecoder('utf-8').decode(bytes);
        const decodedContent = JSON.parse(jsonText);

        renderMsp(decodedContent.msp_items || []);
        renderSchemes(decodedContent.schemes || []);
        status.style.color = "green";
        status.innerText = "Data loaded successfully!";
      } catch (err) {
        console.error(err);
        status.style.color = "red";
        status.innerText = "Error loading data. Check token/repository permissions.";
      }
    }

    function renderMsp(items) {
      const container = document.getElementById("msp-list");
      container.innerHTML = "";
      items.forEach(item => addMspRow(item.title, item.price));
    }

    function addMspRow(title = "", price = "") {
      const container = document.getElementById("msp-list");
      const div = document.createElement("div");
      div.className = "item-row msp-item";
      div.innerHTML = `
        <input type="text" class="msp-title" placeholder="Crop Title (e.g. गहू)" value="${title}">
        <input type="text" class="msp-price" placeholder="Price (e.g. ₹ 2275 / क्विंटल)" value="${price}">
        <button class="btn-danger" onclick="this.parentElement.remove()">Delete</button>
      `;
      container.appendChild(div);
    }

    function renderSchemes(schemes) {
      const container = document.getElementById("schemes-list");
      container.innerHTML = "";
      schemes.forEach(s => addSchemeRow(s.badge, s.title, s.subtitle, s.icon_type));
    }

    function addSchemeRow(badge = "LIVE योजना", title = "", subtitle = "", icon_type = "wallet") {
      const container = document.getElementById("schemes-list");
      const div = document.createElement("div");
      div.className = "item-row scheme-item";
      div.innerHTML = `
        <input type="text" class="s-badge" placeholder="Badge" value="${badge}">
        <input type="text" class="s-title" placeholder="Scheme Title" value="${title}">
        <input type="text" class="s-sub" placeholder="Subtitle" value="${subtitle}">
        <input type="text" class="s-icon" placeholder="Icon (wallet/agriculture)" value="${icon_type}">
        <button class="btn-danger" onclick="this.parentElement.remove()">Delete</button>
      `;
      container.appendChild(div);
    }

    async function saveData() {
      const token = document.getElementById("token").value;
      const status = document.getElementById("status");

      if (!token) {
        alert("Please enter a valid GitHub Personal Access Token.");
        return;
      }

      const msp_items = Array.from(document.querySelectorAll(".msp-item")).map(el => ({
        title: el.querySelector(".msp-title").value,
        price: el.querySelector(".msp-price").value
      }));

      const schemes = Array.from(document.querySelectorAll(".scheme-item")).map(el => ({
        badge: el.querySelector(".s-badge").value,
        title: el.querySelector(".s-title").value,
        subtitle: el.querySelector(".s-sub").value,
        icon_type: el.querySelector(".s-icon").value
      }));

      const payload = { msp_items, schemes };
      
      // --- FIXED MARATHI UTF-8 ENCODING FOR SAVE HERE ---
      const jsonString = JSON.stringify(payload, null, 2);
      const utf8Bytes = new TextEncoder().encode(jsonString);
      const binaryString = String.fromCharCode(...utf8Bytes);
      const contentEncoded = btoa(binaryString);

      status.style.color = "blue";
      status.innerText = "Saving to GitHub...";

      try {
        const res = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${filePath}`, {
          method: "PUT",
          headers: {
            "Authorization": `token ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "Update dashboard data via Admin Panel",
            content: contentEncoded,
            sha: fileSha
          })
        });

        if (res.ok) {
          const resData = await res.json();
          fileSha = resData.content.sha;
          status.style.color = "green";
          status.innerText = "Data updated successfully on GitHub!";
        } else {
          throw new Error("Failed to save");
        }
      } catch (err) {
        console.error(err);
        status.style.color = "red";
        status.innerText = "Error updating data. Make sure token has repository write access.";
      }
    }
  </script>
</body>
</html>
