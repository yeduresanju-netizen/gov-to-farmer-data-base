<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - Government to Farmer Data</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --soil: #4a3a28;
      --forest: #234832;
      --forest-deep: #16301f;
      --wheat: #c99a2e;
      --wheat-light: #e6c877;
      --sage: #93a988;
      --paper: #f6f2e7;
      --paper-card: #fffdf8;
      --line: #e2dac4;
      --danger: #a8402f;
      --danger-deep: #7f2f22;
      --ink: #2b2a22;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Work Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at 15% 0%, rgba(147, 169, 136, 0.16), transparent 45%),
        repeating-linear-gradient(180deg, rgba(74, 58, 40, 0.035) 0px, rgba(74, 58, 40, 0.035) 1px, transparent 1px, transparent 34px),
        var(--paper);
      color: var(--ink);
      margin: 0;
      padding: 32px 20px 60px;
      min-height: 100vh;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      background: var(--paper-card);
      padding: 0 0 32px;
      border-radius: 18px;
      box-shadow: 0 1px 2px rgba(35, 72, 50, 0.06), 0 18px 40px -22px rgba(22, 48, 31, 0.35);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .portal-header {
      position: relative;
      background: linear-gradient(160deg, var(--forest) 0%, var(--forest-deep) 100%);
      padding: 30px 32px 24px;
      color: #f4ead0;
      overflow: hidden;
    }

    .portal-header::before {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 44%;
      background: repeating-linear-gradient(
        100deg,
        rgba(201, 154, 46, 0.16) 0px,
        rgba(201, 154, 46, 0.16) 2px,
        transparent 2px,
        transparent 26px
      );
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--wheat-light);
      font-weight: 600;
      margin-bottom: 10px;
    }

    .eyebrow svg { width: 16px; height: 16px; }

    h2.portal-title {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 30px;
      margin: 0;
      color: #fbf6e6;
      position: relative;
      z-index: 1;
    }

    .portal-subtitle {
      margin: 6px 0 0;
      font-size: 13.5px;
      color: rgba(244, 234, 208, 0.75);
      position: relative;
      z-index: 1;
    }

    .portal-body { padding: 26px 32px 0; }

    .field { margin-bottom: 18px; }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
      font-size: 13.5px;
      color: var(--soil);
    }

    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 14px;
      background: #fffefb;
      color: var(--ink);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="text"]:focus, input[type="password"]:focus, select:focus {
      outline: none;
      border-color: var(--forest);
      box-shadow: 0 0 0 3px rgba(35, 72, 50, 0.12);
    }

    .item-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }

    .item-row input { flex: 1; }

    button {
      background: var(--forest);
      color: #fbf6e6;
      border: none;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      font-family: inherit;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    button:hover { background: var(--forest-deep); }
    button:active { transform: translateY(1px); }

    button.btn-danger { background: var(--danger); padding: 9px 14px; }
    button.btn-danger:hover { background: var(--danger-deep); }

    button.btn-fetch {
      background: var(--wheat);
      color: var(--forest-deep);
    }
    button.btn-fetch:hover { background: #b9891f; }

    button.btn-save {
      font-size: 16px;
      width: 100%;
      padding: 15px;
      margin-top: 6px;
      background: var(--forest);
      box-shadow: 0 10px 22px -12px rgba(35, 72, 50, 0.55);
    }

    hr {
      border: none;
      border-top: 1px dashed var(--line);
      margin: 24px 0;
    }

    .card {
      border: 1px solid var(--line);
      padding: 18px 18px 16px;
      border-radius: 12px;
      margin-bottom: 22px;
      background: #fbf8f0;
      position: relative;
    }

    .card h3 {
      margin: 0 0 14px;
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 18px;
      color: var(--forest-deep);
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .card h3 .badge-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--sage);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    .card h3 .badge-icon svg { width: 15px; height: 15px; color: #16301f; }

    /* Seller Grid Layout */
    .seller-card {
      background: #fffefb;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .seller-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }

    .seller-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
    }

    .seller-card-header span {
      font-weight: bold;
      font-size: 13px;
      color: var(--soil);
    }

    #status {
      font-weight: 600;
      margin-top: 16px;
      font-size: 13.5px;
      min-height: 18px;
    }

    .sprig-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--sage);
      margin: 4px 0 20px;
      user-select: none;
    }
    .sprig-divider::before, .sprig-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    .sprig-divider svg { width: 18px; height: 18px; }

    @media (max-width: 560px) {
      .portal-header, .portal-body { padding-left: 20px; padding-right: 20px; }
      .item-row { flex-wrap: wrap; }
      .seller-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="portal-header">
      <div class="eyebrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21c0-6 4-9 8-10-1 6-4 9-8 10Z"/><path d="M12 21c0-6-4-9-8-10 1 6 4 9 8 10Z"/><path d="M12 21V9"/></svg>
        शासन ते शेतकरी
      </div>
      <h2 class="portal-title">Farmer App Admin Panel</h2>
      <p class="portal-subtitle">MSP दर, योजना आणि विक्री विनंत्या अपडेट करा — थेट गाव पर्यंत पोहोचणारी माहिती.</p>
    </div>

    <div class="portal-body">

      <div class="field">
        <label for="token">GitHub Personal Access Token (PAT):</label>
        <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
      </div>

      <button class="btn-fetch" onclick="loadAllData()">Fetch Latest Data</button>
      <hr>

      <!-- MSP Section -->
      <div class="card">
        <h3>
          <span class="badge-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M12 2c-4 2-6 5-6 9s2 6 6 6 6-2 6-6-2-7-6-9Z"/></svg>
          </span>
          MSP Items (हमीभाव)
        </h3>
        <div id="msp-list"></div>
        <button onclick="addMspRow()">+ Add Item</button>
      </div>

      <div class="sprig-divider">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20V4M12 4 8 8M12 4l4 4M12 10 8 13M12 10l4 3M12 15l-3 3M12 15l3 3"/></svg>
      </div>

      <!-- Schemes Section -->
      <div class="card">
        <h3>
          <span class="badge-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V9l8-5 8 5v12"/><path d="M9 21v-6h6v6"/></svg>
          </span>
          Live Schemes (योजना)
        </h3>
        <div id="schemes-list"></div>
        <button onclick="addSchemeRow()">+ Add Scheme</button>
      </div>

      <div class="sprig-divider">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20V4M12 4 8 8M12 4l4 4M12 10 8 13M12 10l4 3M12 15l-3 3M12 15l3 3"/></svg>
      </div>

      <!-- Sellers Requests Section -->
      <div class="card">
        <h3>
          <span class="badge-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </span>
          Seller Requests (विक्री विनंत्या)
        </h3>
        <div id="sellers-list"></div>
        <button onclick="addSellerRow()">+ Add New Seller</button>
      </div>

      <button class="btn-save" onclick="saveAllData()">Save &amp; Update App Data</button>
      <div id="status"></div>

    </div>
  </div>

  <script>
    const repoOwner = "yeduresanju-netizen";
    const repoName = "gov-to-farmer-data-base";
    const dataFilePath = "data.json";
    const sellersFilePath = "sellers.json";

    let dataFileSha = "";
    let sellersFileSha = "";

    async function loadAllData() {
      const token = document.getElementById("token").value;
      const status = document.getElementById("status");
      status.style.color = "blue";
      status.innerText = "Fetching data...";

      try {
        const headers = token ? { Authorization: `token ${token}` } : {};

        // Fetch data.json
        const resData = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${dataFilePath}`, { headers });
        if (!resData.ok) throw new Error("Failed to fetch data.json");
        const dataJson = await resData.json();
        dataFileSha = dataJson.sha;
        const decodedData = decodeUtf8Base64(dataJson.content);

        renderMsp(decodedData.msp_items || []);
        renderSchemes(decodedData.schemes || []);

        // Fetch sellers.json
        const resSellers = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${sellersFilePath}`, { headers });
        if (!resSellers.ok) throw new Error("Failed to fetch sellers.json");
        const sellersJson = await resSellers.json();
        sellersFileSha = sellersJson.sha;
        const decodedSellers = decodeUtf8Base64(sellersJson.content);

        renderSellers(decodedSellers.sellers || decodedSellers.data || []);

        status.style.color = "green";
        status.innerText = "All data loaded successfully!";
      } catch (err) {
        console.error(err);
        status.style.color = "red";
        status.innerText = "Error loading data. Check token/repository permissions.";
      }
    }

    function decodeUtf8Base64(base64Str) {
      const binaryString = atob(base64Str.replace(/\s/g, ''));
      const bytes = Uint8Array.from(binaryString, char => char.charCodeAt(0));
      return JSON.parse(new TextDecoder('utf-8').decode(bytes));
    }

    function encodeUtf8Base64(jsonObj) {
      const jsonString = JSON.stringify(jsonObj, null, 2);
      const utf8Bytes = new TextEncoder().encode(jsonString);
      const binaryString = String.fromCharCode(...utf8Bytes);
      return btoa(binaryString);
    }

    // --- MSP Logic ---
    function renderMsp(items) {
      const container = document.getElementById("msp-list");
      container.innerHTML = "";
      items.forEach(item => addMspRow(item.title, item.price));
    }

    function addMspRow(title = "", price = "") {
      const container = document.getElementById("msp-list");
      const div = document.createElement("div");
      div.className = "item-row msp-item";
      div.innerHTML = `
        <input type="text" class="msp-title" placeholder="Crop Title (e.g. गहू)" value="${title}">
        <input type="text" class="msp-price" placeholder="Price (e.g. ₹ 2275 / क्विंटल)" value="${price}">
        <button class="btn-danger" onclick="this.parentElement.remove()">Delete</button>
      `;
      container.appendChild(div);
    }

    // --- Schemes Logic ---
    function renderSchemes(schemes) {
      const container = document.getElementById("schemes-list");
      container.innerHTML = "";
      schemes.forEach(s => addSchemeRow(s.badge, s.title, s.subtitle, s.icon_type));
    }

    function addSchemeRow(badge = "LIVE योजना", title = "", subtitle = "", icon_type = "wallet") {
      const container = document.getElementById("schemes-list");
      const div = document.createElement("div");
      div.className = "item-row scheme-item";
      div.innerHTML = `
        <input type="text" class="s-badge" placeholder="Badge" value="${badge}">
        <input type="text" class="s-title" placeholder="Scheme Title" value="${title}">
        <input type="text" class="s-sub" placeholder="Subtitle" value="${subtitle}">
        <input type="text" class="s-icon" placeholder="Icon (wallet/agriculture)" value="${icon_type}">
        <button class="btn-danger" onclick="this.parentElement.remove()">Delete</button>
      `;
      container.appendChild(div);
    }

    // --- Sellers Logic ---
    function renderSellers(sellers) {
      const container = document.getElementById("sellers-list");
      container.innerHTML = "";
      sellers.forEach(s => addSellerRow(s));
    }

    function addSellerRow(seller = {}) {
      const container = document.getElementById("sellers-list");
      const div = document.createElement("div");
      div.className = "seller-card seller-item";

      const id = seller.id || "SEL-" + Date.now();
      const createdAt = seller.created_at || new Date().toISOString();
      const status = seller.status || "प्रलंबित";

      div.innerHTML = `
        <div class="seller-card-header">
          <span>ID: ${id}</span>
          <button class="btn-danger" onclick="this.closest('.seller-card').remove()">Delete Request</button>
        </div>
        <input type="hidden" class="sel-id" value="${id}">
        <input type="hidden" class="sel-created" value="${createdAt}">
        <div class="seller-grid">
          <div>
            <label>Farmer Name (शेतकऱ्याचे नाव)</label>
            <input type="text" class="sel-name" value="${seller.farmer_name || ''}" placeholder="उदा. रमेश पाटील">
          </div>
          <div>
            <label>Phone Number (फोन नंबर)</label>
            <input type="text" class="sel-phone" value="${seller.phone_number || ''}" placeholder="उदा. 9876543210">
          </div>
          <div>
            <label>Crop (पिक)</label>
            <input type="text" class="sel-crop" value="${seller.crop_name || seller.crop || ''}" placeholder="उदा. गहू">
          </div>
          <div>
            <label>Quantity Quintal (क्विंटल)</label>
            <input type="text" class="sel-qty" value="${seller.quantity_quintal || ''}" placeholder="उदा. 15">
          </div>
          <div>
            <label>Grade (ग्रेड)</label>
            <input type="text" class="sel-grade" value="${seller.grade || 'A'}" placeholder="उदा. A">
          </div>
          <div>
            <label>Price/Quintal (दर/क्विंटल)</label>
            <input type="text" class="sel-price" value="${seller.price_per_quintal || ''}" placeholder="उदा. 2275">
          </div>
          <div>
            <label>Location (खरेदी केंद्र)</label>
            <input type="text" class="sel-location" value="${seller.location || ''}" placeholder="उदा. पुणे">
          </div>
          <div>
            <label>Status (स्थिती)</label>
            <select class="sel-status">
              <option value="प्रलंबित" ${status === 'प्रलंबित' ? 'selected' : ''}>प्रलंबित</option>
              <option value="मंजूर" ${status === 'मंजूर' ? 'selected' : ''}>मंजूर</option>
              <option value="नामंजूर" ${status === 'नामंजूर' ? 'selected' : ''}>नामंजूर</option>
              <option value="पूर्ण" ${status === 'पूर्ण' ? 'selected' : ''}>पूर्ण</option>
            </select>
          </div>
        </div>
        <div>
          <label>Remark (टीप)</label>
          <input type="text" class="sel-remark" value="${seller.remark || ''}" placeholder="उदा. कागदपत्रे पडताळणी बाकी">
        </div>
      `;
      container.appendChild(div);
    }

    // --- Save Logic ---
    async function saveAllData() {
      const token = document.getElementById("token").value;
      const status = document.getElementById("status");

      if (!token) {
        alert("Please enter a valid GitHub Personal Access Token.");
        return;
      }

      status.style.color = "blue";
      status.innerText = "Saving to GitHub...";

      try {
        // Build data.json payload
        const msp_items = Array.from(document.querySelectorAll(".msp-item")).map(el => ({
          title: el.querySelector(".msp-title").value,
          price: el.querySelector(".msp-price").value
        }));

        const schemes = Array.from(document.querySelectorAll(".scheme-item")).map(el => ({
          badge: el.querySelector(".s-badge").value,
          title: el.querySelector(".s-title").value,
          subtitle: el.querySelector(".s-sub").value,
          icon_type: el.querySelector(".s-icon").value
        }));

        const dataPayload = { msp_items, schemes };

        // Build sellers.json payload
        const sellers = Array.from(document.querySelectorAll(".seller-item")).map(el => ({
          id: el.querySelector(".sel-id").value,
          farmer_name: el.querySelector(".sel-name").value,
          phone_number: el.querySelector(".sel-phone").value,
          crop_name: el.querySelector(".sel-crop").value,
          quantity_quintal: parseFloat(el.querySelector(".sel-qty").value) || 0,
          grade: el.querySelector(".sel-grade").value,
          price_per_quintal: el.querySelector(".sel-price").value,
          location: el.querySelector(".sel-location").value,
          remark: el.querySelector(".sel-remark").value,
          created_at: el.querySelector(".sel-created").value,
          status: el.querySelector(".sel-status").value
        }));

        const sellersPayload = { sellers };

        // Save data.json
        const resData = await updateGithubFile(dataFilePath, dataPayload, dataFileSha, token);
        if (resData.ok) {
          const resJson = await resData.json();
          dataFileSha = resJson.content.sha;
        } else {
          throw new Error("Failed to save data.json");
        }

        // Save sellers.json
        const resSellers = await updateGithubFile(sellersFilePath, sellersPayload, sellersFileSha, token);
        if (resSellers.ok) {
          const resJson = await resSellers.json();
          sellersFileSha = resJson.content.sha;
        } else {
          throw new Error("Failed to save sellers.json");
        }

        status.style.color = "green";
        status.innerText = "Data updated successfully on GitHub!";
      } catch (err) {
        console.error(err);
        status.style.color = "red";
        status.innerText = "Error updating data. Make sure token has repository write access.";
      }
    }

    async function updateGithubFile(path, contentObj, sha, token) {
      return fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${path}`, {
        method: "PUT",
        headers: {
          "Authorization": `token ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: `Update ${path} via Admin Panel`,
          content: encodeUtf8Base64(contentObj),
          sha: sha
        })
      });
    }
  </script>
</body>
</html>
